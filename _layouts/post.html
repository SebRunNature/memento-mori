---
layout: default
---

<!-- Image illustration responsive au début de chaque article -->
<img
  src="/assets/img/illustration-blog-memento-mori.png"
  width="1672" height="941"
  alt="Memento Mori - Montre de Vie - Âge biologique et longévité au Luxembourg"
  style="width:100%;max-width:720px;height:auto;border-radius:14px;margin-bottom:40px;display:block;object-fit:cover;"
>

<!-- Le contenu de l'article (titre h1 + texte) -->
{{ content }}

{% if page.retenir %}
<!-- L'idée à retenir : une phrase de l'article, avec un lien de partage sur X (simple lien, sans script) -->
<div class="callout" style="margin-top:28px">
  <strong>L'idée à retenir</strong>
  {{ page.retenir }}
  <a href="https://x.com/intent/post?text={{ page.retenir | url_encode }}&amp;url={{ site.url | append: page.url | url_encode }}&amp;via=Montredevie" target="_blank" rel="noopener" style="display:block;width:fit-content;margin-top:10px;font-weight:700;color:var(--amber-lt)">Poster cette idée sur X →</a>
</div>
{% endif %}

{% unless page.support == false %}
{% include support-box.html %}
{% endunless %}
