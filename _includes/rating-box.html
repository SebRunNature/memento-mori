<aside class="rating-box" id="ratingBox" aria-label="Noter cet article">
  <p class="rating-title">Cet article t'a-t-il été utile ?</p>
  <div class="rating-stars" id="ratingStars" role="radiogroup" aria-label="Note de 1 à 5 étoiles">
    <button type="button" role="radio" aria-checked="false" aria-label="1 étoile" data-v="1">★</button>
    <button type="button" role="radio" aria-checked="false" aria-label="2 étoiles" data-v="2">★</button>
    <button type="button" role="radio" aria-checked="false" aria-label="3 étoiles" data-v="3">★</button>
    <button type="button" role="radio" aria-checked="false" aria-label="4 étoiles" data-v="4">★</button>
    <button type="button" role="radio" aria-checked="false" aria-label="5 étoiles" data-v="5">★</button>
  </div>
  <p class="rating-thanks" id="ratingThanks" hidden>✓ Merci pour ta note.</p>
  <div class="rating-nl" id="ratingNl" hidden>
    <p class="rating-nl-title">Restez informé</p>
    <p class="rating-nl-body">Inscris-toi à la newsletter pour recevoir les prochains articles.</p>
    <button type="button" class="rating-btn" id="ratingNlOpen">M'inscrire</button>
    <form id="ratingNlForm" hidden>
      <input type="email" id="ratingNlEmail" placeholder="E-mail" autocomplete="email" required aria-label="Adresse e-mail">
      <label class="rating-consent">
        <input type="checkbox" id="ratingNlConsent" required>
        J'accepte de recevoir des e-mails de Montre de Vie sur les nouveaux articles et outils. Je peux me désinscrire à tout moment via le lien présent dans chaque e-mail.
      </label>
      <button type="submit" class="rating-btn">S'abonner</button>
    </form>
    <p class="rating-thanks" id="ratingNlDone" hidden>✓ Merci, ton inscription est enregistrée.</p>
  </div>
</aside>
<style>
  .rating-box{margin:32px 0;padding:20px;border:1px solid var(--border);border-radius:12px;background:var(--surface);text-align:center}
  .rating-title{font-weight:700;margin:0 0 8px}
  .rating-stars{display:flex;justify-content:center;gap:4px}
  .rating-stars button{background:none;border:0;padding:2px 4px;font-size:2rem;line-height:1;cursor:pointer;color:var(--border2);transition:color .15s}
  .rating-stars button.on{color:var(--amber)}
  .rating-stars button:focus-visible,.rating-btn:focus-visible{outline:2px solid var(--amber-dk);outline-offset:2px}
  .rating-thanks{margin:10px 0 0;font-size:.9rem;font-weight:600;color:var(--muted)}
  .rating-nl{margin-top:16px;padding:16px;border-radius:10px;background:var(--surface2)}
  .rating-nl-title{margin:0 0 4px;font-weight:700}
  .rating-nl-body{margin:0 0 10px;font-size:.9rem;color:var(--muted)}
  .rating-btn{padding:10px 18px;border:0;border-radius:10px;background:var(--amber);color:#1a1200;font-weight:800;font-size:.9rem;cursor:pointer}
  .rating-btn:hover{background:var(--amber-dk)}
  .rating-btn:disabled{opacity:.6;cursor:default}
  #ratingNlForm{max-width:340px;margin:12px auto 0;display:flex;flex-direction:column;gap:10px}
  #ratingNlForm[hidden]{display:none}
  #ratingNlForm input[type=email]{width:100%;padding:12px 14px;border:1px solid var(--border2);border-radius:10px;background:var(--surface);color:var(--text);font:inherit}
  .rating-consent{display:flex;align-items:flex-start;gap:8px;text-align:left;font-size:.75rem;color:var(--muted);line-height:1.5}
  .rating-consent input{margin-top:2px;flex-shrink:0}
</style>
<script>
(function(){
  var ENDPOINT='https://formspree.io/f/mzdjqvbq';
  var page=location.pathname;
  var KEY='mdv_rating:'+page;
  var box=document.getElementById('ratingBox');
  if(!box) return;
  var stars=box.querySelectorAll('#ratingStars button');
  var thanks=document.getElementById('ratingThanks');
  var nl=document.getElementById('ratingNl');
  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function paint(v){stars.forEach(function(b){var on=+b.dataset.v<=v;b.classList.toggle('on',on);b.setAttribute('aria-checked',+b.dataset.v===v?'true':'false')})}
  function lock(){stars.forEach(function(b){b.disabled=true;b.style.cursor='default'});thanks.hidden=false;if(get('mdv_premium_unlocked')!=='1'&&get('mdv_newsletter')!=='1')nl.hidden=false}
  var saved=+get(KEY);
  if(saved>=1&&saved<=5){paint(saved);lock()}
  stars.forEach(function(b){
    b.addEventListener('mouseenter',function(){paint(+b.dataset.v)});
    b.addEventListener('mouseleave',function(){paint(+get(KEY)||0)});
    b.addEventListener('click',function(){
      var v=+b.dataset.v;
      set(KEY,String(v));paint(v);lock();
      var fd=new FormData();
      fd.append('type','note article');
      fd.append('note',v);
      fd.append('page',page);
      fetch(ENDPOINT,{method:'POST',headers:{'Accept':'application/json'},body:fd}).catch(function(){});
    });
  });
  var openBtn=document.getElementById('ratingNlOpen');
  var form=document.getElementById('ratingNlForm');
  openBtn.addEventListener('click',function(){openBtn.hidden=true;form.hidden=false;document.getElementById('ratingNlEmail').focus()});
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var email=document.getElementById('ratingNlEmail').value;
    if(!email||!document.getElementById('ratingNlConsent').checked) return;
    var btn=form.querySelector('button[type=submit]');
    btn.disabled=true;btn.textContent='Envoi…';
    var fd=new FormData();
    fd.append('type','newsletter');
    fd.append('email',email);
    fd.append('consent','oui — recevoir des e-mails de Montre de Vie (nouveaux articles et outils)');
    fd.append('source','Montre de Vie — encart de notation, '+page);
    fetch(ENDPOINT,{method:'POST',headers:{'Accept':'application/json'},body:fd}).then(function(r){
      if(!r.ok) throw new Error();
      set('mdv_newsletter','1');form.hidden=true;document.getElementById('ratingNlDone').hidden=false;
    }).catch(function(){btn.disabled=false;btn.textContent="S'abonner";alert("Erreur d'envoi — réessaie.")});
  });
})();
</script>
